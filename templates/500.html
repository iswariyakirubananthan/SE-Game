{% extends 'base.html' %}

{% block title %}500 – Server Error{% endblock %}

{% block content %}
<div style="text-align: center; max-width: 500px; margin: 4rem auto;">
  <div style="font-size: 5rem; margin-bottom: 1rem;">⚠️</div>
  <h1 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem;">500 – Server Error</h1>
  <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
    An internal server exception occurred while processing your request. Please try again.
  </p>
  <a href="{{ url_for('home.index') }}" class="btn btn-primary btn-lg">Back to Home</a>
</div>
{% endblock %}
