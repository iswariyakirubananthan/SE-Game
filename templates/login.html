{% extends 'base.html' %}

{% block title %}Login – Banana Quest{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span style="font-size: 3rem;">🔐</span>
      <h2 style="font-size: 1.85rem; font-weight: 800; margin-top: 0.5rem;">Player Login</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your credentials to access the game arena</p>
    </div>

    <!-- Login Form (Theme D: Virtual Identity) -->
    <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="player@example.com" 
          value="{{ email or '' }}"
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        🎮 Enter Game Arena
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.92rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{{ url_for('auth.register') }}" style="font-weight: 700; color: var(--banana-yellow);">Create one now</a>
    </div>
  </div>
</div>
{% endblock %}
